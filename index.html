<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>驅魔實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: a talisman-yellow title band over a single-column lab notebook; ticks are cinnabar seals. */
:root {
  --bg: #EEF0EA; --surface: #F9FAF6; --ink: #1D2A2A; --muted: #566462; --line: #CBD2C9;
  --cinnabar: #B92B1B; --on-cinnabar: #FFF6EC;
  --talisman: #EFC94C; --talisman-soft: #F6E4A2; --on-talisman: #2A2108; --title: #A5220F;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --hand: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131A1B; --surface: #1B2425; --ink: #E7EAE3; --muted: #A0ADA9; --line: #35423F;
    --cinnabar: #E8604A; --on-cinnabar: #1F0A06;
    --talisman: #3A2F10; --talisman-soft: #4C3E14; --on-talisman: #F3D777; --title: #F3C84B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131A1B; --surface: #1B2425; --ink: #E7EAE3; --muted: #A0ADA9; --line: #35423F;
  --cinnabar: #E8604A; --on-cinnabar: #1F0A06;
  --talisman: #3A2F10; --talisman-soft: #4C3E14; --on-talisman: #F3D777; --title: #F3C84B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 720px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 2px; }

.band { background: var(--talisman); color: var(--on-talisman); }
.band .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px 24px; padding-block: 28px 20px; }
.band h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(34px, 9vw, 52px); line-height: 1.1; letter-spacing: .08em; color: var(--title); }
.role { margin: 6px 0 0; font-size: 14px; }
.count { text-align: right; font-size: 14px; }
.count b { display: block; font-family: var(--mono); font-size: 28px; line-height: 1.2; font-weight: 500; font-variant-numeric: tabular-nums; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; }
.tab { flex: 1 1 auto; min-width: 0; background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 2px 9px; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cinnabar); font-weight: 700; }
.submit-row .primary { flex: 1; min-height: 48px; font-size: 17px; }
.primary:disabled { opacity: .5; cursor: default; }
@media (max-width: 420px) { .tab { font-size: 13px; } }

main.wrap { padding-block: 24px 64px; display: grid; gap: 28px; }
section.panel { display: grid; gap: 28px; min-width: 0; }
h2 { margin: 0; font-size: 16px; font-weight: 700; }
.group { display: grid; gap: 12px; min-width: 0; }
.muted { color: var(--muted); font-size: 14px; margin: 0; }
.banner { background: var(--talisman-soft); color: var(--on-talisman); padding: 10px 14px; border-radius: 4px; font-size: 14px; margin: 0; }
.empty { border: 1px dashed var(--line); border-radius: 4px; padding: 24px 16px; color: var(--muted); text-align: center; margin: 0; }

.icon-btn { width: 44px; height: 44px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; font-size: 20px; line-height: 1; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--cinnabar); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

.pracs { display: grid; gap: 8px; }
.prac { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.prac:disabled { cursor: default; }
.prac-text { min-width: 0; overflow-wrap: anywhere; }
.prac-text b { display: block; font-weight: 500; }
.prac-text small { display: block; color: var(--muted); font-size: 13px; }
.seal { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 1.5px dashed var(--line); border-radius: 3px; font-family: var(--body); font-weight: 700; font-size: 24px; color: transparent; }
.prac[aria-checked="true"] .seal { background: var(--cinnabar); border: 0; color: var(--on-cinnabar); }
.prac[aria-checked="true"] .prac-text b { color: var(--muted); }
.prac.locked { background: var(--bg); }
.prac.locked .seal { background: var(--muted); color: var(--bg); }
.stamp .seal { animation: stamp .24s ease-out; }
@keyframes stamp { from { transform: scale(1.7); opacity: .3; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stamp .seal { animation: none; } }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font-size: 13px; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--mono); font-size: 24px; font-variant-numeric: tabular-nums; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; max-width: 420px; }
.day { aspect-ratio: 1; max-width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); font-family: var(--mono); font-size: 13px; color: var(--muted); }
.day.part { background: var(--talisman-soft); color: var(--on-talisman); border-color: transparent; }
.day.full { background: var(--cinnabar); color: var(--on-cinnabar); border-color: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; margin-right: 5px; border-radius: 2px; vertical-align: -1px; border: 1px solid var(--line); background: var(--surface); }
.legend .p { background: var(--talisman-soft); border-color: transparent; }
.legend .f { background: var(--cinnabar); border-color: transparent; }

.field { display: grid; gap: 4px; min-width: 0; font-size: 14px; color: var(--muted); }
input[type="text"], input[type="date"], input[type="number"], textarea { width: 100%; min-width: 0; padding: 9px 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
textarea { min-height: 132px; resize: vertical; font-family: var(--hand); font-size: 17px; line-height: 1.8; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.edit-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.edit-list li { display: flex; align-items: center; gap: 12px; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.edit-list li > span { min-width: 0; }
.danger { flex: none; background: none; border: 0; padding: 4px 0; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.danger.armed { color: var(--cinnabar); font-weight: 700; }
.primary { justify-self: start; padding: 10px 18px; background: var(--cinnabar); color: var(--on-cinnabar); border: 0; border-radius: 4px; font-weight: 700; }
.ghost { padding: 10px 14px; background: none; border: 1px solid var(--line); border-radius: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
form { display: grid; gap: 12px; margin: 0; min-width: 0; }
.energy { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 14px; color: var(--muted); }
.energy button { width: 40px; height: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; font-family: var(--mono); }
.energy.who button { width: auto; padding-inline: 14px; font-family: var(--body); }
.energy button[aria-pressed="true"] { background: var(--talisman); color: var(--on-talisman); border-color: transparent; }

.entries { display: grid; gap: 22px; margin: 0; padding: 0; list-style: none; }
.entry { display: grid; gap: 4px; min-width: 0; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-size: 15px; font-weight: 700; }
.pill { padding: 0 7px; border-radius: 3px; background: var(--talisman-soft); color: var(--on-talisman); font-size: 12px; }
.pill.me { background: var(--cinnabar); color: var(--on-cinnabar); }
.text { margin: 0; font-family: var(--hand); font-size: 17px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry .actions { margin-top: 2px; gap: 14px; }

.datebar { display: flex; align-items: flex-end; gap: 8px; }
.date-field { flex: 1; }
.date-field input { height: 44px; text-align: center; }
.dayline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.remain { display: grid; gap: 2px; padding: 10px 14px; border-radius: 4px; background: var(--talisman-soft); color: var(--on-talisman); font-size: 14px; overflow-wrap: anywhere; }
.remain b { font-size: 15px; }
.remain.clear { background: var(--cinnabar); color: var(--on-cinnabar); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.matrix { border-collapse: separate; border-spacing: 0; font-size: 13px; }
.matrix th, .matrix td { min-width: 44px; padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--line); font-weight: 500; white-space: nowrap; }
.matrix tbody tr:last-child th, .matrix tbody tr:last-child td { border-bottom: 0; }
.matrix thead th { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.matrix small { display: block; font-family: var(--body); font-size: 11px; color: var(--muted); font-weight: 400; }
.matrix .name { position: sticky; left: 0; z-index: 1; min-width: 104px; max-width: 150px; padding-inline: 10px; text-align: left; white-space: normal; background: var(--surface); border-right: 1px solid var(--line); color: var(--ink); font-family: var(--body); }
.matrix .off { color: var(--muted); background: var(--bg); font-size: 12px; }
.mark { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 2px; background: var(--cinnabar); color: var(--on-cinnabar); font-family: var(--display); font-weight: 900; font-size: 14px; transform: rotate(-7deg); }
.miss { color: var(--muted); }
.day.future { background: none; border-style: dashed; }
.day.later { cursor: default; opacity: .6; }
.day.rest { background: var(--line); color: var(--muted); border-color: transparent; }
.legend .r { background: var(--line); border-color: transparent; }
textarea.short { min-height: 76px; }
@media (min-width: 560px) { .pracs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: calc(100vw - 32px); padding: 9px 16px; background: var(--ink); color: var(--bg); border-radius: 4px; font-size: 14px; }
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div>
      <h1>驅魔實驗室</h1>
      <p class="role">訂課實驗紀錄</p>
    </div>
    <div class="count" id="count"></div>
  </div>
</header>


<nav class="tabs" aria-label="頁籤">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="tab-checkin" data-view="checkin" type="button">每日打卡</button>
    <button class="tab" role="tab" id="tab-overview" data-view="overview" type="button">打卡紀錄</button>
    <button class="tab" role="tab" id="tab-journal" data-view="journal" type="button">實驗者心路歷程</button>
    <button class="tab" role="tab" id="tab-notes" data-view="notes" type="button">觀察者留言板</button>
    <button class="tab" role="tab" id="tab-rules" data-view="rules" type="button">規則</button>
  </div>
</nav>

<main class="wrap">
  <p class="banner" id="banner" hidden></p>

  <section class="panel" id="view-checkin" role="tabpanel" aria-labelledby="tab-checkin">
    <div class="group" id="check-controls" hidden>
      <div class="datebar">
        <button class="icon-btn" id="prev-day" type="button" aria-label="前一天">‹</button>
        <label class="field date-field">打卡日期<input type="date" id="check-date"></label>
        <button class="icon-btn" id="next-day" type="button" aria-label="後一天">›</button>
      </div>
      <div class="dayline"><span id="day-label"></span><button class="link" id="go-today" type="button" hidden>回到今天</button></div>
    </div>
    <div class="group" id="today-group"></div>
  </section>

  <section class="panel" id="view-overview" role="tabpanel" aria-labelledby="tab-overview" hidden>
    <p class="empty" id="overview-empty" hidden></p>
    <div class="group" id="progress-group" hidden>
      <h2>實驗進度</h2>
      <dl class="stats" id="stats"></dl>
      <div class="days" id="days"></div>
      <div class="legend"><span><i class="f"></i>全部完成</span><span><i class="p"></i>部分完成</span><span><i></i>未打卡</span><span><i class="r"></i>休息</span></div>
    </div>
    <div class="group" id="matrix-group" hidden>
      <h2>每項訂課的打卡紀錄</h2>
      <p class="muted">最新的日期在最左邊，往右滑看更早的日子。</p>
      <div class="table-wrap" id="matrix"></div>
    </div>
  </section>

  <section class="panel" id="view-journal" role="tabpanel" aria-labelledby="tab-journal" hidden>
    <form id="journal-form">
      <h2 id="journal-heading">寫下今天的觀察</h2>
      <label class="field">日期<input type="date" id="journal-date" required></label>
      <div class="energy" id="energy" role="group" aria-label="今天的能量，1 最低，5 最高，可不填">
        <span>今天的能量（選填）</span>
        <button type="button" data-v="1" aria-pressed="false">1</button>
        <button type="button" data-v="2" aria-pressed="false">2</button>
        <button type="button" data-v="3" aria-pressed="false">3</button>
        <button type="button" data-v="4" aria-pressed="false">4</button>
        <button type="button" data-v="5" aria-pressed="false">5</button>
      </div>
      <label class="field">觀察與心態
        <textarea id="journal-body" maxlength="5000" required placeholder="今天身體、情緒、念頭有什麼變化？"></textarea>
      </label>
      <div class="actions">
        <button class="primary" type="submit" id="journal-submit">儲存紀錄</button>
        <button class="ghost" type="button" id="journal-cancel" hidden>取消編輯</button>
      </div>
    </form>
    <div class="group">
      <h2>歷程紀錄</h2>
      <ol class="entries" id="journal-list"></ol>
      <p class="empty" id="journal-empty" hidden></p>
    </div>
  </section>

  <section class="panel" id="view-notes" role="tabpanel" aria-labelledby="tab-notes" hidden>
    <form id="note-form">
      <h2>留下一則留言</h2>
      <label class="field">留言內容
        <textarea id="note-body" maxlength="3000" required placeholder="這段時間你看到了什麼變化？"></textarea>
      </label>
      <button class="primary" type="submit">送出留言</button>
    </form>
    <div class="group">
      <h2>所有留言</h2>
      <ol class="entries" id="note-list"></ol>
      <p class="empty" id="note-empty" hidden></p>
    </div>
  </section>

  <section class="panel" id="view-rules" role="tabpanel" aria-labelledby="tab-rules" hidden>
    <div class="group">
      <h2>實驗規則</h2>
      <label class="field">規則內容<textarea id="rule-text" class="short" maxlength="500"></textarea></label>
    </div>
    <div class="group">
      <h2>要做訂課的日子</h2>
      <div class="energy who" id="weekday-picks" role="group" aria-label="要做訂課的星期"></div>
    </div>
    <div class="group">
      <h2>休息日</h2>
      <p class="muted">國定假日或其他要休息的日子加在這裡，這天不列入打卡和完成率。</p>
      <ul class="edit-list" id="rest-list"></ul>
      <form id="rest-form">
        <label class="field">日期<input type="date" id="rest-date" required></label>
        <button class="primary" type="submit">加入休息日</button>
      </form>
    </div>
    <div class="group">
      <h2>實驗期間</h2>
      <div class="two">
        <label class="field">開始日期<input type="date" id="set-start"></label>
        <label class="field">結束日期<input type="date" id="set-end"></label>
      </div>
    </div>
    <div class="group">
      <h2>訂課清單</h2>
      <ul class="edit-list" id="edit-list"></ul>
      <form id="add-form">
        <label class="field">訂課名稱<input type="text" id="add-name" maxlength="60" required></label>
        <label class="field">說明（選填，例如時間或次數）<input type="text" id="add-note" maxlength="120"></label>
        <button class="primary" type="submit">加入訂課</button>
      </form>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  const VIEWS = ["checkin", "overview", "journal", "notes", "rules"];
  const DEFAULT_DAYS = 21;
  const DEFAULT_RULES = { weekdays: [1, 2, 3, 4, 5], restDays: [], text: "只做平日，見紅就休息" };

  const API = "https://script.google.com/macros/s/AKfycbyHMXCObmXzh1VNL9aL0vl6xC8JHrlRmGY83uN88fDpYnO5roRPZfF3bfiQYEmc-ccr/exec"; /* Apps Script 網頁應用程式網址 */
  const POLL_MS = 30000;

  const S = {
    loaded: false, drafts: {}, saving: false,
    cfg: null, checkins: {}, journal: [], notes: [],
    view: "checkin", selDate: null, justStamped: null, editing: null, energy: null,
  };

  /* ---- dates: plain YYYY-MM-DD strings in the viewer's local calendar ---- */
  const pad = (n) => String(n).padStart(2, "0");
  const toIso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => toIso(new Date());
  const parts = (s) => s.split("-").map(Number);
  const utc = (s) => { const [y, m, d] = parts(s); return Date.UTC(y, m - 1, d); };
  const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 86400000);
  const addDays = (s, n) => { const x = new Date(utc(s) + n * 86400000); return `${x.getUTCFullYear()}-${pad(x.getUTCMonth() + 1)}-${pad(x.getUTCDate())}`; };
  const prettyDate = (s) => { const [, m, d] = parts(s); return `${m} 月 ${d} 日 週${WEEK[new Date(utc(s)).getUTCDay()]}`; };
  const stamp = (ms) => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

  const dayNo = (date) => S.cfg ? diffDays(S.cfg.startDate, date) + 1 : null;
  const dayLabel = (date) => {
    const n = dayNo(date);
    if (n === null) return "";
    if (n < 1) return "實驗開始前";
    if (n > S.cfg.days) return "實驗結束後";
    return `第 ${n} 天`;
  };
  const lastDay = () => addDays(S.cfg.startDate, S.cfg.days - 1);
  const lastElapsed = () => { const t = today(), e = lastDay(); return t < e ? t : e; };
  const started = () => !!S.cfg && today() >= S.cfg.startDate;
  const applies = (p, date) => (!p.addedOn || date >= p.addedOn) && (!p.removedOn || date < p.removedOn);
  const rules = () => ({ ...DEFAULT_RULES, ...((S.cfg && S.cfg.rules) || {}) });
  const weekdayOf = (s) => new Date(utc(s)).getUTCDay();
  const restReason = (date) => {
    const r = rules();
    if (r.restDays.includes(date)) return "休息日";
    return r.weekdays.includes(weekdayOf(date)) ? "" : `週${WEEK[weekdayOf(date)]}休息`;
  };
  const activeOn = (date) => (restReason(date) ? [] : (S.cfg ? S.cfg.practices : []).filter((p) => applies(p, date)));
  const currentPractices = () => (S.cfg ? S.cfg.practices : []).filter((p) => !p.removedOn);
  const doneMap = (date) => (S.checkins[date] && S.checkins[date].done) || {};
  const dayScore = (date) => {
    const list = activeOn(date), done = doneMap(date);
    return { total: list.length, done: list.filter((p) => done[p.id]).length };
  };
  const elapsedDates = () => {
    if (!started()) return [];
    const out = [];
    for (let d = S.cfg.startDate, end = lastElapsed(); d <= end; d = addDays(d, 1)) out.push(d);
    return out;
  };
  function computeStats() {
    const dates = elapsedDates();
    let fullDays = 0, sumDone = 0, sumTotal = 0;
    for (const d of dates) {
      const s = dayScore(d);
      sumDone += s.done; sumTotal += s.total;
      if (s.total > 0 && s.done === s.total) fullDays++;
    }
    let streak = 0;
    for (let i = dates.length - 1; i >= 0; i--) {
      const s = dayScore(dates[i]);
      const full = s.total > 0 && s.done === s.total;
      if (full) streak++;
      else if (dates[i] !== today()) break; /* today still in progress does not break the run */
    }
    return { fullDays, streak, rate: sumTotal ? Math.round((sumDone / sumTotal) * 100) : 0 };
  }

  /* ---- small DOM helpers; all user text goes through textContent ---- */
  function h(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
      else if (v === true) n.setAttribute(k, "");
      else if (v !== false && v != null) n.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null) n.append(c);
    return n;
  }
  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }
  function setBanner(msg) { const b = $("banner"); b.textContent = msg || ""; b.hidden = !msg; }
  function deleteButton(label, onConfirm) {
    let timer;
    const b = h("button", { class: "danger", type: "button" }, label);
    b.addEventListener("click", () => {
      if (b.classList.contains("armed")) { clearTimeout(timer); onConfirm(); return; }
      b.classList.add("armed"); b.textContent = "再按一次確認刪除";
      timer = setTimeout(() => { b.classList.remove("armed"); b.textContent = label; }, 4000);
    });
    return b;
  }

  /* ---- writes: one at a time, in order ---- */
  async function call(action, body) {
    const res = await fetch(API, { method: "POST", body: JSON.stringify({ action, ...body }) });
    const d = await res.json();
    if (!d.ok) { const e = new Error(d.error || "request failed"); e.code = d.code; throw e; }
    return d;
  }
  let lastRaw = "";
  function applyData(data) {
    const raw = JSON.stringify(data);
    if (raw === lastRaw && S.loaded) return;
    lastRaw = raw;
    S.cfg = data.cfg || null;
    if (S.cfg && !Array.isArray(S.cfg.practices)) S.cfg.practices = [];
    S.checkins = data.checkins || {};
    S.journal = data.journal || [];
    S.notes = data.notes || [];
    S.loaded = true;
    render();
  }
  /* writes run one at a time; a poll that started before a write is discarded */
  let queue = Promise.resolve(), writes = 0, inFlight = 0, refreshing = false;
  function write(action, body) {
    writes++; inFlight++;
    const run = queue.then(() => call(action, body));
    queue = run.catch(() => {});
    return run.then((d) => {
      inFlight--;
      if (!inFlight) applyData(d.data);
      return true;
    }, (e) => {
      inFlight--;
      if (e.code === "invalid") toast(e.message);
      else toast("儲存失敗，請檢查網路後再試一次。");
      lastRaw = "";
      refresh();
      return false;
    });
  }
  async function refresh() {
    if (!API || refreshing || document.hidden) return;
    refreshing = true;
    const startedAt = writes;
    try {
      const d = await call("getAll");
      if (startedAt === writes && !inFlight) applyData(d.data);
      setBanner("");
    } catch (e) {
      setBanner("暫時連不上紀錄，稍後會自動重試。");
    }
    refreshing = false;
  }
  const clone = (o) => JSON.parse(JSON.stringify(o));
  /* a sheet cell reads a leading = as a formula; a leading ' makes it literal and is not stored */
  const sheetSafe = (s) => (/^[=']/.test(s) ? "'" + s : s);
  function saveCfg(next) {
    S.cfg = next; render();
    return write("saveConfig", { cfg: next });
  }
  function baseCfg() {
    if (S.cfg) return clone(S.cfg);
    const startDate = $("set-start").value || today();
    const days = $("set-end").value ? diffDays(startDate, $("set-end").value) + 1 : DEFAULT_DAYS;
    return { startDate, days, practices: [] };
  }

  /* ---- render ---- */
  function renderHeader() {
    const count = $("count");
    count.replaceChildren();
    if (!S.cfg) return;
    const t = today(), start = S.cfg.startDate;
    if (t < start) count.append(h("b", null, `${diffDays(t, start)} 天後`), "實驗開始");
    else if (t > lastDay()) count.append(h("b", null, `${S.cfg.days} 天`), "實驗已結束");
    else count.append(h("b", null, `${dayNo(t)} / ${S.cfg.days}`), "實驗第幾天");
  }
  function renderTabs() {
    for (const v of VIEWS) {
      const tab = $("tab-" + v), on = S.view === v;
      tab.setAttribute("aria-selected", String(on));
      $("view-" + v).hidden = !on;
    }
  }
  function clampSel() {
    if (!S.cfg || !started()) { S.selDate = null; return; }
    const end = lastElapsed();
    if (!S.selDate || S.selDate > end) S.selDate = end;
    if (S.selDate < S.cfg.startDate) S.selDate = S.cfg.startDate;
  }
  function renderToday() {
    const g = $("today-group");
    const focusId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.pid : null;
    const ready = S.loaded && currentPractices().length > 0 && started();
    $("check-controls").hidden = !ready;
    g.replaceChildren();
    if (!S.loaded) { g.append(h("p", { class: "empty" }, "正在讀取打卡紀錄……")); return; }
    if (!currentPractices().length) {
      g.append(h("p", { class: "empty" }, "還沒有訂課。到「規則」分頁加入第一項訂課。"));
      return;
    }
    if (!started()) {
      g.append(h("p", { class: "empty" }, `實驗從 ${prettyDate(S.cfg.startDate)} 開始，當天起就能打卡。`));
      return;
    }
    const sel = S.selDate, end = lastElapsed(), isToday = sel === today();
    const input = $("check-date");
    input.min = S.cfg.startDate; input.max = end;
    if (document.activeElement !== input) input.value = sel;
    $("prev-day").disabled = sel <= S.cfg.startDate;
    $("next-day").disabled = sel >= end;
    $("go-today").hidden = isToday || today() > end;
    const score = dayScore(sel), saved = doneMap(sel), picked = draftOf(sel);
    const reason = restReason(sel);
    $("day-label").textContent = `${prettyDate(sel)}　${dayLabel(sel)}` + (reason ? "" : `　已打卡 ${score.done} / ${score.total}`);
    if (reason) {
      g.append(h("p", { class: "empty" }, `${reason}，這天不用打卡。`));
      g.append(h("p", { class: "muted" }, "要調整休息日，到「規則」分頁修改。"));
      return;
    }
    const list = activeOn(sel), left = list.filter((p) => !saved[p.id]);
    const word = isToday ? "今天" : "這天";
    g.append(left.length
      ? h("div", { class: "remain" }, h("b", null, `${word}尚未完成 ${left.length} 項`), h("span", null, left.map((p) => p.name).join("、")))
      : h("div", { class: "remain clear" }, h("b", null, `${word}的訂課全部完成`)));
    const allPicked = list.every((p) => picked[p.id]);
    g.append(h("div", { class: "pracs" }, list.map((p) => {
      const locked = !!saved[p.id], isDone = !!picked[p.id];
      return h("button", {
        class: "prac" + (locked ? " locked" : S.justStamped === p.id && isDone ? " stamp" : ""),
        type: "button", role: "checkbox", "aria-checked": String(isDone), "data-pid": p.id,
        disabled: locked, on: { click: () => toggle(p.id) },
      },
        h("span", { class: "seal", "aria-hidden": "true" }, "✓"),
        h("span", { class: "prac-text" }, h("b", null, p.name), p.note ? h("small", null, p.note) : null, locked ? h("small", null, "已打卡") : null));
    })));
    const changed = !sameDone(picked, saved);
    g.append(h("div", { class: "actions submit-row" },
      h("button", { class: "primary", id: "checkin-submit", type: "button", disabled: !changed || S.saving, on: { click: submitCheckin } },
        S.saving ? "打卡中……" : changed || !Object.keys(saved).length ? "打卡" : "已打卡"),
      left.length ? h("button", { class: "ghost", type: "button", on: { click: () => setAll(!allPicked) } }, allPicked ? "全部取消" : "全部勾選") : null));
    if (focusId) { const el = g.querySelector(`[data-pid="${focusId}"]`); if (el) el.focus(); }
    S.justStamped = null;
  }
  function renderOverview() {
    const hasPractices = S.loaded && !!S.cfg && S.cfg.practices.length > 0;
    const empty = $("overview-empty");
    empty.hidden = !S.loaded || hasPractices;
    empty.textContent = "還沒有訂課，加入訂課後這裡會顯示打卡狀況。";
    $("progress-group").hidden = !hasPractices;
    $("matrix-group").hidden = !hasPractices || !started();
    if (!hasPractices) return;
    const st = computeStats();
    $("stats").replaceChildren(...[["全部完成", `${st.fullDays} 天`], ["目前連續", `${st.streak} 天`], ["總完成率", `${st.rate}%`]]
      .map(([k, v]) => h("div", null, h("dt", null, k), h("dd", null, v))));
    const t = lastElapsed(), cells = [];
    for (let i = 0; i < S.cfg.days; i++) {
      const d = addDays(S.cfg.startDate, i), future = !started() || d > t;
      const s = dayScore(d), rest = !!restReason(d);
      const cls = rest ? "rest" : future ? "future" : s.total && s.done === s.total ? "full" : s.done ? "part" : "";
      cells.push(h("button", {
        class: `day ${cls}${future ? " later" : ""}`, type: "button", disabled: future,
        "aria-label": `第 ${i + 1} 天，${prettyDate(d)}，` + (rest ? "休息" : `完成 ${s.done} / ${s.total}`),
        title: prettyDate(d), on: { click: () => { S.selDate = d; location.hash = "checkin"; } },
      }, String(i + 1)));
    }
    $("days").replaceChildren(...cells);
    const dates = elapsedDates().reverse();
    const head = h("tr", null, h("th", { class: "name", scope: "col" }, "訂課"), dates.map((d) => {
      const [, m, day] = parts(d);
      return h("th", { scope: "col" }, `${m}/${day}`, h("small", null, `週${WEEK[weekdayOf(d)]}`));
    }));
    const body = S.cfg.practices.filter((p) => !p.removedOn || dates.some((d) => applies(p, d))).map((p) => {
      const due = dates.filter((d) => applies(p, d) && !restReason(d));
      const n = due.filter((d) => doneMap(d)[p.id]).length;
      return h("tr", null,
        h("th", { class: "name", scope: "row" }, p.name + (p.removedOn ? "（已移除）" : ""), h("small", null, `${n} / ${due.length} 天`)),
        dates.map((d) => {
          if (restReason(d)) return h("td", { class: "off" }, "休");
          if (!applies(p, d)) return h("td", null, "");
          return h("td", null, doneMap(d)[p.id] ? h("span", { class: "mark" }, "成") : h("span", { class: "miss", "aria-label": "未完成" }, "·"));
        }));
    });
    $("matrix").replaceChildren(h("table", { class: "matrix" }, h("thead", null, head), h("tbody", null, body)));
  }
  function renderRules() {
    const r = rules(), text = $("rule-text");
    if (document.activeElement !== text) text.value = r.text;
    const picks = [1, 2, 3, 4, 5, 6, 0].map((d) => h("button", {
      type: "button", "aria-pressed": String(r.weekdays.includes(d)), on: { click: () => toggleWeekday(d) },
    }, `週${WEEK[d]}`));
    $("weekday-picks").replaceChildren(...picks);
    $("rest-list").replaceChildren(...(r.restDays.length ? [...r.restDays].sort().map((d) => h("li", null,
      h("span", null, prettyDate(d)),
      deleteButton("移除", () => setRest(d, false)))) : [h("li", { class: "muted" }, "目前沒有休息日。")]));
    const start = $("set-start"), end = $("set-end");
    if (document.activeElement !== start) start.value = S.cfg ? S.cfg.startDate : (start.value || today());
    if (document.activeElement !== end) end.value = S.cfg ? lastDay() : (end.value || addDays(today(), DEFAULT_DAYS - 1));
    const list = currentPractices();
    $("edit-list").replaceChildren(...(list.length ? list.map((p) => h("li", null,
      h("span", null, p.name, p.note ? `（${p.note}）` : ""),
      deleteButton("移除", () => removePractice(p.id)))) : [h("li", { class: "muted" }, "清單是空的，用下方表單加入。")]));
  }
  function renderJournal() {
    const dateInput = $("journal-date");
    dateInput.max = today();
    if (!dateInput.value) dateInput.value = today();
    const list = [...S.journal].sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
    $("journal-list").replaceChildren(...list.map((e) => {
      const meta = h("div", { class: "meta" }, h("b", null, prettyDate(e.date)), dayLabel(e.date) ? h("span", null, dayLabel(e.date)) : null,
        e.energy ? h("span", { class: "pill" }, `能量 ${e.energy} / 5`) : null);
      const acts = h("div", { class: "actions" },
        h("button", { class: "link", type: "button", on: { click: () => startEdit(e) } }, "編輯"),
        deleteButton("刪除", () => write("deleteJournal", { id: e.id }).then((ok) => ok && toast("已刪除這筆紀錄"))));
      return h("li", { class: "entry" }, meta, h("p", { class: "text" }, e.body), acts);
    }));
    const empty = $("journal-empty");
    empty.hidden = !S.loaded || list.length > 0;
    empty.textContent = "還沒有紀錄。用上方表單寫下第一篇。";
  }
  function renderNotes() {
    const list = [...S.notes].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    $("note-list").replaceChildren(...list.map((n) => {
      const date = n.createdAt ? toIso(new Date(n.createdAt)) : null;
      return h("li", { class: "entry" },
        h("div", { class: "meta" },
          n.createdAt ? h("span", null, stamp(n.createdAt)) : null,
          date && dayLabel(date) ? h("span", null, dayLabel(date)) : null),
        h("p", { class: "text" }, n.body),
        h("div", { class: "actions" }, deleteButton("刪除", () => write("deleteNote", { id: n.id }).then((ok) => ok && toast("已刪除這則留言")))));
    }));
    const empty = $("note-empty");
    empty.hidden = !S.loaded || list.length > 0;
    empty.textContent = "還沒有留言。觀察者看到的變化可以寫在這裡。";
  }
  function render() {
    clampSel();
    renderHeader(); renderTabs(); renderToday(); renderOverview(); renderRules(); renderJournal(); renderNotes();
  }

  /* ---- actions ---- */
  /* ticks stay on this device until the 打卡 button saves them */
  const draftOf = (date) => ({ ...doneMap(date), ...(S.drafts[date] || {}) });
  const sameDone = (a, b) => JSON.stringify(Object.keys(a).sort()) === JSON.stringify(Object.keys(b).sort());
  function toggle(pid) {
    const date = S.selDate, next = clone(draftOf(date));
    if (next[pid]) delete next[pid]; else { next[pid] = true; S.justStamped = pid; }
    S.drafts[date] = next;
    render();
  }
  function setAll(on) {
    const date = S.selDate, next = clone(draftOf(date));
    for (const p of activeOn(date)) {
      if (doneMap(date)[p.id]) continue; /* saved check-ins stay locked */
      if (on) next[p.id] = true; else delete next[p.id];
    }
    S.drafts[date] = next;
    render();
  }
  async function submitCheckin() {
    const date = S.selDate, done = clone(draftOf(date));
    S.saving = true;
    render();
    const ok = await write("setCheckin", { date, done });
    S.saving = false;
    if (ok) {
      delete S.drafts[date];
      S.checkins = { ...S.checkins, [date]: { done } };
      toast("已打卡");
    }
    render();
  }
  function saveRules(patch, msg) {
    const next = baseCfg();
    next.rules = { ...rules(), ...patch };
    saveCfg(next).then((ok) => {
      if (ok) toast(S.cfg && S.cfg.rules ? msg : "規則沒有存到，請先更新 Google 後端。");
    });
  }
  function toggleWeekday(d) {
    const cur = rules().weekdays;
    saveRules({ weekdays: cur.includes(d) ? cur.filter((x) => x !== d) : [...cur, d] }, "已更新要做訂課的日子");
  }
  function setRest(date, on) {
    const cur = rules().restDays.filter((d) => d !== date);
    saveRules({ restDays: on ? [...cur, date] : cur }, on ? "已設為休息日" : "已取消休息日");
  }
  function removePractice(pid) {
    const next = baseCfg(), t = today();
    next.practices = next.practices.map((p) => (p.id === pid ? { ...p, removedOn: t } : p));
    saveCfg(next).then((ok) => ok && toast("已移除，過去的打卡紀錄會保留"));
  }
  function setEnergy(v) {
    S.energy = v;
    for (const b of $("energy").querySelectorAll("button")) b.setAttribute("aria-pressed", String(Number(b.dataset.v) === v));
  }
  function resetJournal() {
    S.editing = null; setEnergy(null);
    $("journal-body").value = ""; $("journal-date").value = today();
    $("journal-heading").textContent = "寫下今天的觀察";
    $("journal-submit").textContent = "儲存紀錄";
    $("journal-cancel").hidden = true;
  }
  function startEdit(e) {
    S.editing = e.id; setEnergy(e.energy || null);
    $("journal-body").value = e.body; $("journal-date").value = e.date;
    $("journal-heading").textContent = `編輯 ${prettyDate(e.date)} 的紀錄`;
    $("journal-submit").textContent = "更新紀錄";
    $("journal-cancel").hidden = false;
    $("journal-form").scrollIntoView({ block: "center" });
    $("journal-body").focus();
  }

  /* ---- events on the fixed page parts ---- */
  for (const v of VIEWS) $("tab-" + v).addEventListener("click", () => { location.hash = v; });
  function routeFromHash() {
    const v = location.hash.slice(1);
    S.view = VIEWS.includes(v) ? v : "checkin";
    renderTabs();
  }
  window.addEventListener("hashchange", routeFromHash);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { render(); refresh(); }
  });
  $("prev-day").addEventListener("click", () => { S.selDate = addDays(S.selDate, -1); render(); });
  $("next-day").addEventListener("click", () => { S.selDate = addDays(S.selDate, 1); render(); });
  $("go-today").addEventListener("click", () => { S.selDate = today(); render(); });
  $("check-date").addEventListener("change", (e) => {
    const d = e.target.value;
    if (!d || d < S.cfg.startDate || d > lastElapsed()) { toast("這個日期不在可打卡的範圍內。"); e.target.value = S.selDate; return; }
    S.selDate = d; render();
  });
  $("rule-text").addEventListener("change", (e) => saveRules({ text: e.target.value.trim() }, "已更新規則"));
  $("rest-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const d = $("rest-date").value;
    if (d) { setRest(d, true); $("rest-date").value = ""; }
  });

  $("add-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("add-name").value.trim();
    if (!name) return;
    const next = baseCfg();
    next.practices.push({
      id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name, note: $("add-note").value.trim(),
      addedOn: Object.keys(S.checkins).length ? today() : null, removedOn: null,
    });
    $("add-name").value = ""; $("add-note").value = "";
    saveCfg(next).then((ok) => ok && toast("已加入訂課"));
    $("add-name").focus();
  });
  function savePeriod() {
    const startDate = $("set-start").value, endDate = $("set-end").value;
    if (!S.cfg || !startDate || !endDate) return;
    const days = diffDays(startDate, endDate) + 1;
    if (days < 1) { toast("結束日期不能早於開始日期。"); return; }
    if (days > 365) { toast("實驗期間最長 365 天。"); return; }
    const next = baseCfg();
    next.startDate = startDate; next.days = days; S.selDate = null;
    saveCfg(next).then((ok) => ok && toast("已更新實驗期間"));
  }
  $("set-start").addEventListener("change", savePeriod);
  $("set-end").addEventListener("change", savePeriod);
  $("energy").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const v = Number(b.dataset.v); setEnergy(S.energy === v ? null : v);
  });
  $("journal-cancel").addEventListener("click", resetJournal);
  $("journal-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = $("journal-body").value.trim(), date = $("journal-date").value;
    if (!body || !date) return;
    const submit = $("journal-submit");
    submit.disabled = true;
    const ok = await write("saveJournal", { id: S.editing, date, energy: S.energy, body: sheetSafe(body) });
    submit.disabled = false;
    if (ok) { resetJournal(); toast("已儲存紀錄"); }
  });
  $("note-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = $("note-body").value.trim();
    if (!body) return;
    const ok = await write("addNote", { body: sheetSafe(body) });
    if (ok) { $("note-body").value = ""; toast("留言已送出"); }
  });

  /* ---- start ---- */
  routeFromHash();
  render();
  if (!API) {
    setBanner("網站的資料後端還沒接上。");
  } else {
    refresh();
    setInterval(refresh, POLL_MS);
  }
})();
</script>
</body>
</html>
